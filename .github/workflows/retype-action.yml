name: Build CommandPost Website
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    types: [closed]
  issues:
    types: [opened, closed, labeled, unlabeled]
  release:
    types: [created]

# Every trigger (pushes, issues, releases) commits to main and pushes the
# 'retype' branch, so overlapping runs get "rejected (fetch first)". Run one
# at a time; a newer queued run replaces an older queued one.
concurrency:
  group: build-commandpost-website
  cancel-in-progress: false

jobs:
  generate_markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install axios

      - name: Generate Bug Tracker Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: node .github/scripts/generate-bug-tracker.js

      - name: Generate Wish List Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: node .github/scripts/generate-wishlist.js

      - name: Generate Snippets Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: node .github/scripts/generate-snippets.js

      - name: Generate Sponsors Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node .github/scripts/generate-sponsors.js

      - name: Commit and push if it's necessary
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop
            git add docs/_includes/*
            git commit -m "Update Generated Markdown Files"
            git push
          )

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/

  publish:
    name: Publish to retype branch
    needs: [generate_markdown]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Retype 4.6.0 intermittently crashes during its parallel deploy phase
      # ("A concurrent update was performed on this collection..." or
      # "capacity ('-2') must be a non-negative value"). It's a race inside
      # Retype, not a content problem, so retry the build once before failing.
      - id: retype-build
        uses: retypeapp/action-build@latest
        continue-on-error: true
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_SECRET }}

      - name: Retry Retype build
        if: steps.retype-build.outcome == 'failure'
        uses: retypeapp/action-build@latest
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_SECRET }}

      - uses: retypeapp/action-github-pages@latest
        with:
          update-branch: true